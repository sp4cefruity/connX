services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: connx
      POSTGRES_PASSWORD: connx
      POSTGRES_DB: connx
    ports:
      - "5432:5432"
    volumes:
      - connx_db_data:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U connx"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg2://connx:connx@db:5432/connx
      # Provider settings can be overridden from the shell or a root .env file.
      # ORS_API_KEY / LOCATIONIQ_API_KEY are optional: with no ORS key routing
      # runs on public OSRM only; with no LocationIQ key search is Photon then
      # Nominatim.
      ROUTING_PROVIDER: ${ROUTING_PROVIDER:-ors}
      ORS_API_KEY: ${ORS_API_KEY:-}
      GEOCODING_PROVIDER: ${GEOCODING_PROVIDER:-photon}
      LOCATIONIQ_API_KEY: ${LOCATIONIQ_API_KEY:-}
      # OSM blocks placeholder contacts: set a real one for Nominatim/Photon.
      NOMINATIM_USER_AGENT: "${NOMINATIM_USER_AGENT:-ConnX/0.1 (contact: your-real-email@yourdomain.com)}"
      ENVIRONMENT: development
      FRONTEND_ORIGIN: http://localhost:3000
      SESSION_SECRET: change-me-in-production
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  # PARKED (ADR 0007) — self-hosted Valhalla, kept for later:
  #   docker compose --profile valhalla up --build
  # Prepare the extract first with scripts/valhalla-setup.sh (see README). The
  # backend does not depend on this service: when it is down or a point is
  # outside the extract, the backend falls back to the public OSRM servers.
  # valhalla:
  #   image: ghcr.io/valhalla/valhalla-scripted:latest
  #   restart: unless-stopped
  #   profiles: ["valhalla"]
  #   ports:
  #     - "8002:8002"
  #   environment:
  #     # Builds tiles from the .osm.pbf in /custom_files on first start, then
  #     # reuses them (use_tiles_ignore_pbf defaults to True).
  #     server_threads: "4"
  #   volumes:
  #     - ./valhalla/custom_files:/custom_files

  # Optional: containerized frontend for a single-command full stack.
  # Off by default so `docker compose up` still gives the fast native
  # `npm run dev` workflow most contributors want day-to-day. Opt in with:
  #   docker compose --profile full up --build
  # NEXT_PUBLIC_API_URL points at localhost:8000, not the in-network
  # "backend" hostname, because this value ships to the USER'S BROWSER,
  # which is outside the Docker network and can only reach the backend
  # through its published host port.
  frontend:
    build: ./frontend
    restart: unless-stopped
    profiles: ["full"]
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  connx_db_data:
